apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pgwatch
  namespace: pgwatch
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pgwatch
  endpoints:
    - port: pgwatch
      interval: 15s
      path: /metrics
